(()=>{let x0=null;const lb=$('#lightbox');lb.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});lb.addEventListener('touchend',e=>{if(x0===null||LB.ids.length<2)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50){LB.i=(LB.i+(dx<0?1:-1)+LB.ids.length)%LB.ids.length;drawLB();}});})();

/* ---------- ADD ---------- */
const ADD={files:[],st:{cat:'group',group:'',member:'',chemi:'',tags:'',memo:'',sub:''},saving:false,form:null};
function renderAdd(){
  const root=$('#v-add');
  root.innerHTML=`<div class="sec-h"><div><div class="eyebrow">ADD MEDIA</div><h2>写真・動画をまとめて追加</h2></div></div>
   <div class="add-layout">
    <div class="panel" style="display:flex;flex-direction:column;gap:14px">
     <label class="drop" id="drop" for="add-input"><span class="big c-pink">${ic('image')}</span><b>写真・動画を選ぶ</b><span class="note">何枚でもまとめて選べます。ここにドラッグ＆ドロップもOK</span>
      <input type="file" id="add-input" accept="image/*,video/*" multiple hidden></label>
     <div class="pastewrap"><button type="button" class="btn primary" id="paste-btn">${ic('copy')}コピーした写真を貼り付け</button>
      <div class="pastebox" id="pastebox" contenteditable="true" inputmode="none" role="textbox" aria-label="コピーした写真を貼り付ける欄" spellcheck="false" data-ph="ボタンでうまくいかないときは、ここを長押し→「ペースト」（PCは Ctrl / ⌘ + V）"></div></div>
     <div id="add-preview"></div>
    </div>
    <div class="panel" style="display:flex;flex-direction:column;gap:14px">
     <div class="sec-h"><h2 style="font-size:16px">選んだファイルに付ける分類</h2></div>
     <div id="add-form"></div>
     <div id="add-progress" hidden><div class="progress"><i></i></div><p class="note" id="add-ptext" style="margin:6px 0 0"></p></div>
     <button class="btn primary" id="add-save">${ic('check')}ライブラリに保存</button>
     <p class="note" style="margin:0">写真・動画はこのブラウザの中に保存されます。ブラウザのデータを消すと消えるので、My Roomの「バックアップ」で定期的に書き出しておくと安心です。</p>
    </div>
   </div>`;
  ADD.form=mountTagForm($('#add-form'),ADD.st,{prefix:'add'});
  drawAddPreview();pumpThumbs();
  const input=$('#add-input'),drop=$('#drop');
  input.addEventListener('change',()=>{addFiles([...input.files]);input.value='';});
  ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
  ['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
  drop.addEventListener('drop',e=>addFiles([...(e.dataTransfer?.files||[])]));
  const pb=$('#pastebox');
  pb.addEventListener('beforeinput',e=>{if(e.inputType!=='insertFromPaste'&&e.inputType!=='insertFromDrop')e.preventDefault();});
  $('#paste-btn').addEventListener('click',pasteFromClipboard);
  pb.addEventListener('drop',e=>{e.preventDefault();addFiles([...(e.dataTransfer?.files||[])]);});
  $('#add-save').addEventListener('click',saveAdd);
  $('#add-preview').addEventListener('click',e=>{if(ADD.saving)return;const r=e.target.closest('[data-rm]');if(r){const i=ADD.files.findIndex(f=>f.key===r.dataset.rm);if(i>=0)ADD.files.splice(i,1);drawAddPreview();return;}
    if(e.target.closest('[data-act="clear-add"]')){ADD.files=[];drawAddPreview();}
    if(e.target.closest('[data-act="show-all-add"]')){ADD.showAll=true;drawAddPreview();}});
}
function resetPasteBox(){const pb=$('#pastebox');if(pb)pb.innerHTML='';}
function pasteName(type,i){const d=new Date(),p=n=>String(n).padStart(2,'0');const ext=(type.split('/')[1]||'png').replace('jpeg','jpg').replace('quicktime','mov').replace(/\+.*$/,'');return `paste_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}_${i+1}.${ext}`;}
const isMedia=t=>/^(image|video)\//.test(t||'');
function srcsFromText(html,txt){
  const srcs=[...String(html||'').matchAll(/<img[^>]+src=["']([^"']+)["']/gi)].map(m=>m[1].replace(/&amp;/g,'&'));
  const t=String(txt||'').trim();
  if(!srcs.length&&/^(https?:|data:image)/.test(t))srcs.push(t);
  return srcs;
}
async function fileFromImgEl(img,i){
  if(!img.complete||!img.naturalWidth)await new Promise(r=>{img.onload=img.onerror=r;setTimeout(r,3000)});
  if(!img.naturalWidth)return null;
  try{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));return b?new File([b],pasteName('image/jpeg',i),{type:'image/jpeg',lastModified:Date.now()}):null;}catch(e){return null}
}
async function filesFromSrcs(srcs,imgEls){
  const out=[];
  for(const [i,src] of srcs.slice(0,30).entries()){
    let f=null;
    try{const res=await fetch(src);if(res.ok){const b=await res.blob();if(isMedia(b.type))f=new File([b],pasteName(b.type,i),{type:b.type,lastModified:Date.now()});}}catch(_){}
    if(!f&&imgEls&&imgEls[i])f=await fileFromImgEl(imgEls[i],i);
    if(f)out.push(f);
  }
  return out;
}
function takeFiles(files,label){
  addFiles(files.map((f,i)=>new File([f],f.name&&!/^image\.(png|jpe?g|gif|webp)$/i.test(f.name)?f.name:pasteName(f.type||'image/png',i),{type:f.type||'image/png',lastModified:Date.now()})));
  toast(`${files.length}件を${label||'貼り付けました'}`);
}
const PASTE_FAIL='写真を取り込めませんでした。リンクではなく写真そのものを長押し→「コピー」してから試してください';
async function pasteFromClipboard(){
  if(!navigator.clipboard||!navigator.clipboard.read){toast('このブラウザではボタンが使えません。下の欄を長押し→「ペースト」してください');$('#pastebox')?.focus();return;}
  let items;
  try{items=await navigator.clipboard.read();}
  catch(e){toast(e&&e.name==='NotAllowedError'?'貼り付けが許可されませんでした。もう一度押して、出てきた「ペースト」をタップしてください':'クリップボードを読み取れませんでした。下の欄を長押し→「ペースト」で試してください');return;}
  const files=[];const srcs=[];
  for(const [i,it] of items.entries()){
    const mt=it.types.find(isMedia);
    if(mt){try{const b=await it.getType(mt);files.push(new File([b],pasteName(b.type||mt,i),{type:b.type||mt}))}catch(_){}continue;}
    try{const html=it.types.includes('text/html')?await (await it.getType('text/html')).text():'';const txt=it.types.includes('text/plain')?await (await it.getType('text/plain')).text():'';srcs.push(...srcsFromText(html,txt));}catch(_){}
  }
  if(files.length){takeFiles(files);return;}
  if(srcs.length){const got=await filesFromSrcs(srcs);if(got.length){takeFiles(got);return;}}
  toast(PASTE_FAIL);
}
async function handlePaste(e){
  if(VIEW!=='add')return;
  const t=e.target;const inBox=!!(t&&t.closest&&t.closest('#pastebox'));
  if(t&&t.closest&&t.closest('input,textarea'))return;
  const cd=e.clipboardData;
  const files=[];
  if(cd){[...(cd.items||[])].forEach(it=>{if(it.kind==='file'){const f=it.getAsFile();if(f&&isMedia(f.type))files.push(f)}});
    if(!files.length)[...(cd.files||[])].forEach(f=>{if(isMedia(f.type))files.push(f)});}
  if(files.length){e.preventDefault();resetPasteBox();takeFiles(files);return;}
  const srcs=cd?srcsFromText(cd.getData('text/html'),cd.getData('text/plain')):[];
  if(inBox){
    // let Safari insert the pasted picture into the box, then read it from there
    setTimeout(async()=>{const pb=$('#pastebox');const imgs=pb?[...pb.querySelectorAll('img')]:[];
      const got=imgs.length?await filesFromSrcs(imgs.map(x=>x.getAttribute('src')||''),imgs):srcs.length?await filesFromSrcs(srcs):[];
      resetPasteBox();if(got.length)takeFiles(got);else toast(PASTE_FAIL);},120);
    return;
  }
  e.preventDefault();
  if(!srcs.length){toast(PASTE_FAIL);return;}
  const got=await filesFromSrcs(srcs);if(got.length)takeFiles(got);else toast(PASTE_FAIL);
}
document.addEventListener('paste',handlePaste);
const PREVIEW_MAX=60;
function addFiles(files){let skipped=0;
  files.forEach(f=>{const k=kindOf(f);if(!k){skipped++;return}ADD.files.push({file:f,kind:k,key:uid(),thumb:undefined,tp:null})});
  if(skipped)toast(`${skipped}件は写真・動画ではないため除きました`);
  if(ADD.files.length>PREVIEW_MAX)ADD.showAll=false;
  drawAddPreview();pumpThumbs();}
function thumbOf(f){if(!f.tp)f.tp=makeThumb(f.file,f.kind).then(t=>{f.thumb=t;f.turl=t?URL.createObjectURL(t):null;return t});return f.tp;}
let thumbPumping=false;
async function pumpThumbs(){
  if(thumbPumping)return;thumbPumping=true;
  try{for(let i=0;i<ADD.files.length;i++){
      if(VIEW!=='add'&&!ADD.saving)break;
      const f=ADD.files[i];if(f.tp)continue;
      if(i>=(ADD.showAll?ADD.files.length:PREVIEW_MAX)&&!ADD.saving)break; // only make previews for what is visible
      await thumbOf(f);
      const el=document.querySelector(`[data-pkey="${f.key}"]`);if(el)el.innerHTML=previewInner(f);
      await new Promise(r=>setTimeout(r,0));
  }}finally{thumbPumping=false}
}
function previewInner(f){return `${f.turl?`<img src="${f.turl}" alt="">`:`<span class="pph">${f.tp?(f.thumb===null?esc((f.file.name||'').slice(-12)):'…'):'…'}</span>`}${f.kind==='video'?'<span class="k">動画</span>':''}`}
function drawAddPreview(){const el=$('#add-preview');if(!el)return;
  const sb=$('#add-save');
  if(!ADD.files.length){el.innerHTML='';if(sb){sb.disabled=true;sb.innerHTML=`${ic('check')}ライブラリに保存`;}return;}
  const total=ADD.files.reduce((s,f)=>s+f.file.size,0);
  const show=ADD.showAll?ADD.files:ADD.files.slice(0,PREVIEW_MAX);
  el.innerHTML=`<div class="resline" style="margin-bottom:8px"><span><b>${ADD.files.length}</b> 件選択中（${fmtSize(total)}）</span><span class="sp"><button class="btn sm ghost" data-act="clear-add">すべて外す</button></span></div>
   <div class="pgrid">${show.map(f=>`<div class="pitem"><span class="pinner" data-pkey="${f.key}">${previewInner(f)}</span><button class="rm" data-rm="${f.key}" aria-label="外す">×</button></div>`).join('')}</div>
   ${ADD.files.length>show.length?`<div style="text-align:center;margin-top:8px"><button class="btn sm" data-act="show-all-add">ほか ${ADD.files.length-show.length}件も表示</button></div>`:''}`;
  if(sb){sb.disabled=false;sb.innerHTML=`${ic('check')}${ADD.files.length}件をライブラリに保存`;}
}
let wakeLock=null;
async function keepAwake(on){try{if(on){if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen');}else if(wakeLock){await wakeLock.release();wakeLock=null;}}catch(e){}}
async function saveAdd(){
  if(ADD.saving||!ADD.files.length)return;
  const err=validateTag(ADD.st);if(err){toast(err);return;}
  const total=ADD.files.reduce((s,f)=>s+f.file.size,0);
  try{const est=await navigator.storage?.estimate?.();if(est&&est.quota&&est.quota-est.usage<total*1.15){
    if(!await confirmBox('保存できる容量が足りないかもしれません',`選んだファイルは合計 ${fmtSize(total)} ですが、このブラウザで使える残りは約 ${fmtSize(Math.max(0,est.quota-est.usage))} です。途中で止まった場合、保存できなかった分はこの画面に残ります。`,'このまま保存する'))return;}}catch(_){}
  ADD.saving=true;const btn=$('#add-save');btn.disabled=true;
  try{await navigator.storage?.persist?.()}catch(e){}
  keepAwake(true);
  const prog=$('#add-progress');prog.hidden=false;const bar=$('#add-progress i'),pt=$('#add-ptext');
  const list=[...ADD.files];const n=list.length;let ok=0;const failed=[];let quota=false;const base=Date.now();
  for(let i=0;i<n;i++){const f=list[i];
    pt.textContent=`${i+1} / ${n} 件を保存中…　保存が終わるまで、この画面を開いたままにしてください`;
    try{const thumb=await thumbOf(f);
      const m={id:uid(),kind:f.kind,cat:'group',groupIds:[],memberIds:[],chemiId:null,tags:[],memo:'',fav:false,added:base+i,name:f.file.name,mime:f.file.type,size:f.file.size,taken:f.file.lastModified||null,thumb};
      applyTag(m,ADD.st,false);await saveItem(m,f.file);MEDIA.set(m.id,m);ok++;
      if(f.turl){URL.revokeObjectURL(f.turl);f.turl=null}
      ADD.files=ADD.files.filter(x=>x!==f);
    }catch(e){console.error(e);failed.push(f);if(e&&(e.name==='QuotaExceededError'||/quota/i.test(e.message||''))){quota=true;break;}}
    bar.style.width=`${Math.round((i+1)/n*100)}%`;
    if(i%10===9){const sb=$('#add-save');if(sb)sb.innerHTML=`${ic('check')}${ADD.files.length}件をライブラリに保存`;}
    await new Promise(r=>setTimeout(r,0));
  }
  ADD.saving=false;keepAwake(false);
  if(ADD.files.length){
    prog.hidden=true;bar.style.width='0';
    toast(quota?`${ok}件を保存しました。容量がいっぱいで残り${ADD.files.length}件は保存できませんでした`:`${ok}件を保存しました。${ADD.files.length}件は保存できなかったので、もう一度「保存」を押してください`);
    drawAddPreview();return;
  }
  toast(`${ok}件をライブラリに保存しました`);
  const g=ADD.st.group;
  const sc=ADD.st.cat;const cg=sc==='chemi'?(chemiGroups(C.get(ADD.st.chemi)||{memberIds:[]})[0]||g):g;
  Object.assign(LIB,{mode:'browse',g:cg||'',sec:cg?sc:'',b:sc==='member'?'m:'+ADD.st.member:sc==='chemi'?'c:'+ADD.st.chemi:'',s:ADD.st.sub||'',kind:'all'});ADD.st.sub='';
  ADD.st.tags='';ADD.st.memo='';
  go('library');
}

/* ---------- CALENDAR ---------- */
function renderCalendar(){
  const root=$('#home-cal');if(!root)return;const all=[...MEDIA.values()];
  const byDay=new Map();all.forEach(m=>{const k=dkey(tsOf(m));if(!byDay.has(k))byDay.set(k,[]);byDay.get(k).push(m)});
  byDay.forEach(l=>l.sort((a,b)=>tsOf(b)-tsOf(a)));
  const y=CAL.y,mo=CAL.m;const first=new Date(y,mo,1),days=new Date(y,mo+1,0).getDate(),lead=first.getDay();
  const today=dkey(Date.now());const pre=`${y}-${String(mo+1).padStart(2,'0')}-`;
  const monthItems=all.filter(m=>dkey(tsOf(m)).startsWith(pre));
  const activeDays=[...byDay.keys()].filter(k=>k.startsWith(pre)).sort().reverse();
  if(CAL.day&&!CAL.day.startsWith(pre))CAL.day='';
  if(!CAL.day)CAL.day=byDay.has(today)&&today.startsWith(pre)?today:(activeDays[0]||'');
  let cells='';for(let i=0;i<lead;i++)cells+='<span class="cday out" aria-hidden="true"></span>';
  for(let d=1;d<=days;d++){const k=pre+String(d).padStart(2,'0');const l=byDay.get(k)||[];const wd=(lead+d-1)%7;const cover=l.find(m=>m.thumb);
    cells+=`<button class="cday ${l.length?'has':''} ${wd===0?'sun':wd===6?'sat':''} ${k===today?'today':''} ${k===CAL.day?'sel':''}" data-cday="${k}" aria-label="${mo+1}月${d}日 ${l.length}件">${cover?`<img src="${thumbURL(cover)}" alt="">`:''}<span class="num">${d}</span>${l.length?`<span class="cnt">${l.length}</span>`:''}</button>`;}
  const dayList=CAL.day?(byDay.get(CAL.day)||[]):[];LAST.calendar=dayList.map(m=>m.id);
  const dd=CAL.day?new Date(CAL.day+'T00:00:00'):null;
  const basisWord=CAL.basis==='taken'?'の日付':'に追加';
  root.innerHTML=`<div class="bsec-h"><h3>カレンダー</h3><span>写真を追加した日</span></div>
  <div class="cal-layout">
   <div class="panel" style="display:flex;flex-direction:column;gap:12px">
    <div class="cal-head"><button class="lb-btn" data-cal="prev" aria-label="前の月">${ic('left')}</button><h3>${y}年${mo+1}月</h3><button class="lb-btn" data-cal="next" aria-label="次の月">${ic('right')}</button><button class="btn sm ghost" data-cal="today">今月</button></div>
    <div class="seg" role="group" aria-label="日付の基準"><button class="${CAL.basis==='added'?'on':''}" data-cbasis="added">追加した日</button><button class="${CAL.basis==='taken'?'on':''}" data-cbasis="taken">写真ファイルの日付</button></div>
    <div class="cal">${WD.map((w,i)=>`<span class="wd ${i===0?'sun':i===6?'sat':''}">${w}</span>`).join('')}${cells}</div>
    <div class="cal-sum"><span>この月：<b>${monthItems.length}</b>件</span><span>写真 <b>${monthItems.filter(m=>m.kind==='photo').length}</b></span><span>動画 <b>${monthItems.filter(m=>m.kind==='video').length}</b></span><span>記録した日 <b>${activeDays.length}</b>日</span></div>
    ${CAL.basis==='taken'?'<p class="note" style="margin:0">「写真ファイルの日付」はファイルに残っている日付です。撮影日や保存した日になることが多く、ない場合は追加した日で表示します。</p>':''}
   </div>
   <div class="panel" style="display:flex;flex-direction:column;gap:12px">
    ${dd?`<div class="sec-h"><h2 style="font-size:16px">${dd.getMonth()+1}月${dd.getDate()}日（${WD[dd.getDay()]}）${basisWord}</h2><span class="muted" style="font-size:13px">${dayList.length}件</span></div>
     ${dayList.length?`<div class="grid" data-view="calendar">${dayList.map(tileHTML).join('')}</div>`:'<p class="note" style="margin:0">この日の写真・動画はありません。</p>'}`
     :emptyHTML('cal','c-lilac','この月の記録はまだありません','写真や動画を追加すると、その日のマスにサムネイルと件数が表示されます。')}
    ${activeDays.length>1?`<div class="flabel" style="margin-top:4px">この月の記録</div><div class="daylist">${activeDays.map(k=>{const l=byDay.get(k);const d=new Date(k+'T00:00:00');const c=l.find(m=>m.thumb);const names=[...new Set(l.map(titleOf))].slice(0,4).join('、');return `<button class="dayrow" data-cday="${k}">${c?`<img src="${thumbURL(c)}" alt="">`:'<span class="ph0"></span>'}<span class="t"><b>${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）· ${l.length}件</b><span>${esc(names)}</span></span></button>`}).join('')}</div>`:''}
   </div>
  </div>`;
  hydrate(root);
}
$('#v-home').addEventListener('click',e=>{if(!e.target.closest('#home-cal'))return;
  const c=e.target.closest('[data-cday]');if(c){CAL.day=c.dataset.cday;renderCalendar();if(c.classList.contains('dayrow'))$('#home-cal .cal-layout > .panel:last-child')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
  const b=e.target.closest('[data-cbasis]');if(b){CAL.basis=b.dataset.cbasis;CAL.day='';renderCalendar();return;}
  const a=e.target.closest('[data-cal]')?.dataset.cal;if(!a)return;
  if(a==='prev'){CAL.m--;if(CAL.m<0){CAL.m=11;CAL.y--}}
  if(a==='next'){CAL.m++;if(CAL.m>11){CAL.m=0;CAL.y++}}
  if(a==='today'){const d=new Date();CAL.y=d.getFullYear();CAL.m=d.getMonth()}
  CAL.day='';renderCalendar();
});

/* ---------- ROOM ---------- */
async function renderRoom(){
  const root=$('#v-room');
  const wall=await getMeta('wallpaper').catch(()=>null);const wu=wall?URL.createObjectURL(wall):null;
  let usage='';try{const e=await navigator.storage?.estimate?.();if(e)usage=`使用中 ${fmtSize(e.usage||0)} / 目安上限 ${fmtSize(e.quota||0)}`}catch(_){}
  root.innerHTML=`<div class="sec-h"><div><div class="eyebrow">PERSONALIZE</div><h2>My Room</h2></div></div>
  <div class="room-grid">
   <div class="panel" id="room-wall" style="display:flex;flex-direction:column;gap:14px">
    <div class="sec-h"><h2 style="font-size:16px">壁紙</h2><span class="eyebrow">WALLPAPER</span></div>
    <div class="wall-prev">${wu?`<img src="${wu}" alt="現在の壁紙">`:'初期デザイン（壁紙なし）'}</div>
    <div class="btn-row"><button class="btn primary" data-act="pick-wall">${ic('image')}写真から選ぶ</button>${wu?`<button class="btn ghost" data-act="reset-wall">初期デザインに戻す</button>`:''}</div>
    <div class="field"><label for="rm-shade">文字を読みやすくする（重ねる色の濃さ） <span class="muted" id="rm-shade-v">${Math.round(SET.shade*100)}%</span></label><input type="range" id="rm-shade" min="0" max="0.9" step="0.05" value="${SET.shade}"></div>
    <div class="field"><label for="rm-blur">壁紙のぼかし <span class="muted" id="rm-blur-v">${SET.blur}px</span></label><input type="range" id="rm-blur" min="0" max="24" step="1" value="${SET.blur}"></div>
    <p class="note" style="margin:0">保存済みの写真を壁紙にするときは、写真を開いて ${ic('wall')} を押します。</p>
   </div>
   <div class="panel" style="display:flex;flex-direction:column;gap:12px">
    <div class="sec-h"><h2 style="font-size:16px">バックアップ</h2><span class="eyebrow">BACKUP</span></div>
    <p class="note" style="margin:0">写真・動画と分類をまとめて1つのZIPに書き出せます。別のブラウザや端末でも「読み込む」で復元できます。${usage?`<br>${usage}`:''}</p>
    <div class="btn-row"><button class="btn" data-act="export">${ic('down')}すべて書き出す</button><button class="btn" data-act="import">${ic('box')}バックアップを読み込む</button></div>
    <div id="bk-progress" class="note"></div>
   </div>
  </div>`;
  if(wu)setTimeout(()=>URL.revokeObjectURL(wu),60000);
  $('#rm-shade').addEventListener('input',e=>{SET.shade=+e.target.value;$('#rm-shade-v').textContent=Math.round(SET.shade*100)+'%';applySettings();});
  $('#rm-blur').addEventListener('input',e=>{SET.blur=+e.target.value;$('#rm-blur-v').textContent=SET.blur+'px';applySettings();});
  ['change'].forEach(t=>{$('#rm-shade').addEventListener(t,saveSettings);$('#rm-blur').addEventListener(t,saveSettings);});
}
function applySettings(){document.documentElement.style.setProperty('--shade',SET.shade);document.documentElement.style.setProperty('--blur',SET.blur+'px');}
function saveSettings(){putMeta('settings',SET).catch(()=>{});}
let wallURL=null;
async function setWallpaper(blob){
  let b=blob;
  try{const u=URL.createObjectURL(blob);const img=await loadImg(u);const s=Math.min(1,2400/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);b=await new Promise(r=>c.toBlob(r,'image/jpeg',.88))||blob;}catch(e){}
  await putMeta('wallpaper',b).catch(()=>{});showWall(b);if(VIEW==='room')renderRoom();
}
function showWall(b){if(wallURL){URL.revokeObjectURL(wallURL);wallURL=null}
  if(b){wallURL=URL.createObjectURL(b);$('#wall').style.backgroundImage=`url("${wallURL}")`;document.body.classList.add('has-wall')}
  else{$('#wall').style.backgroundImage='';document.body.classList.remove('has-wall')}}
$('#hidden-wall-input').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f){await setWallpaper(f);toast('壁紙を設定しました')}});

/* backup */
async function exportAll(){
  if(!window.JSZip){toast('書き出しの準備ができていません');return;}
  const out=$('#bk-progress');const zip=new JSZip();const list=[...MEDIA.values()];
  const meta=list.map(m=>{const {thumb,...rest}=m;return rest});
  zip.file('catalog.json',JSON.stringify(CAT));zip.file('media.json',JSON.stringify(meta));zip.file('settings.json',JSON.stringify(SET));ICONS.forEach((b,k)=>zip.file(`icons/${encodeURIComponent(k)}.jpg`,b));
  let i=0;for(const m of list){const b=await getFile(m.id);if(b)zip.file(`files/${m.id}`,b);if(m.thumb)zip.file(`thumbs/${m.id}.jpg`,m.thumb);i++;if(out)out.textContent=`${i} / ${list.length} 件を準備中…`;}
  const wall=await getMeta('wallpaper').catch(()=>null);if(wall)zip.file('wallpaper.jpg',wall);
  if(out)out.textContent='ZIPを作成中…';
  const blob=await zip.generateAsync({type:'blob'},p=>{if(out)out.textContent=`ZIPを作成中… ${Math.round(p.percent)}%`});
  await downloadBlob(blob,`kphoto-backup_${fmtDate(Date.now()).replace(/\./g,'')}.zip`);if(out)out.textContent=`${list.length}件を書き出しました（${fmtSize(blob.size)}）`;
}
async function importAll(file){
  if(!window.JSZip){toast('読み込みの準備ができていません');return;}
  const out=$('#bk-progress');
  try{const zip=await JSZip.loadAsync(file);
    const cat=JSON.parse(await zip.file('catalog.json').async('string'));const meta=JSON.parse(await zip.file('media.json').async('string'));
    const gi=new Set(CAT.groups.map(x=>x.id)),mi=new Set(CAT.members.map(x=>x.id)),ci=new Set(CAT.chemis.map(x=>x.id));
    cat.groups.forEach(x=>{if(!gi.has(x.id))CAT.groups.push(x)});cat.members.forEach(x=>{if(!mi.has(x.id))CAT.members.push(x)});cat.chemis.forEach(x=>{if(!ci.has(x.id))CAT.chemis.push(x)});CAT.subs=CAT.subs||[];const si=new Set(CAT.subs.map(x=>x.id));(cat.subs||[]).forEach(x=>{if(!si.has(x.id))CAT.subs.push(x)});
    (cat.agencies||[]).forEach(a=>{if(!CAT.agencies.includes(a))CAT.agencies.push(a)});await saveCat();
    let n=0,i=0;for(const m of meta){i++;if(out)out.textContent=`${i} / ${meta.length} 件を読み込み中…`;if(MEDIA.has(m.id))continue;
      const fz=zip.file(`files/${m.id}`);if(!fz)continue;const blob=new Blob([await fz.async('arraybuffer')],{type:m.mime||''});
      const tz=zip.file(`thumbs/${m.id}.jpg`);m.thumb=tz?new Blob([await tz.async('arraybuffer')],{type:'image/jpeg'}):null;
      await saveItem(m,blob);MEDIA.set(m.id,m);n++;}
    const ifs=[];zip.forEach((p,f)=>{if(p.startsWith('icons/')&&!f.dir)ifs.push([p,f])});for(const [p,f] of ifs){const k=decodeURIComponent(p.slice(6).replace(/\.jpg$/,''));if(!ICONS.has(k))ICONS.set(k,new Blob([await f.async('arraybuffer')],{type:'image/jpeg'}))}if(ifs.length)await saveIcons();
    const wz=zip.file('wallpaper.jpg');if(wz&&!(await getMeta('wallpaper').catch(()=>null))){const w=new Blob([await wz.async('arraybuffer')],{type:'image/jpeg'});await putMeta('wallpaper',w);showWall(w);}
    if(out)out.textContent=`${n}件を読み込みました`;toast(`バックアップから${n}件を復元しました`);renderRoom();
  }catch(e){console.error(e);if(out)out.textContent='このファイルは読み込めませんでした。KPhotoで書き出したZIPを選んでください。';}
}
$('#hidden-import-input').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importAll(f);});

/* ---------- global actions ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='toggle-filters'){const v=VIEW;F[v].open=!F[v].open;renderGridView(v);return;}
  if(a==='reset-filters'){const v=VIEW;F[v]=Object.assign(blankF(),{open:F[v].open});renderGridView(v);return;}
  if(a==='more'){SHOWN[b.dataset.view]+=120;renderGridView(b.dataset.view);return;}
  if(a==='toggle-select'){SEL.on?(endSelect(),refresh()):startSelect(VIEW);return;}
  if(a==='open-group'){LIB.mode='browse';LIB.g=b.dataset.id;LIB.sec='';LIB.b='';LIB.s='';go('library');try{history.pushState({lib:{...LIB}},'','#library')}catch(_){}return;}
  if(a==='go-search'){LIB.mode='search';go('library',{focus:'q'});return;}
  if(a==='toggle-theme'){const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);setTheme(dark?'light':'dark');return;}
  if(a==='new-group'){openGroupModal(null);return;}
  if(a==='edit-group'){openGroupModal(b.dataset.id);return;}
  if(a==='new-chemi'){openChemiModal(null);return;}
  if(a==='edit-chemi'){openChemiModal(b.dataset.id);return;}
  if(a==='go-room-wall'||a==='go-room-groups'){go('room');setTimeout(()=>$(a==='go-room-wall'?'#room-wall':'#room-groups')?.scrollIntoView({behavior:'smooth',block:'start'}),120);return;}
  if(a==='pick-wall'){$('#hidden-wall-input').click();return;}
  if(a==='wall-from-lib'){F.library.kind='photo';go('library');toast('写真を開いて「壁紙に設定」ボタンを押してください');return;}
  if(a==='reset-wall'){await putMeta('wallpaper',null).catch(()=>{});showWall(null);renderRoom();toast('初期デザインに戻しました');return;}
  if(a==='export'){exportAll();return;}
  if(a==='import'){$('#hidden-import-input').click();return;}
});
document.addEventListener('click',e=>{const t=e.target.closest('[data-theme-set]');if(t)setTheme(t.dataset.themeSet);});
document.addEventListener('click',async e=>{const p=e.target.closest('[data-preset]');if(!p)return;const pr=PRESET_GROUPS.find(x=>x[0]===p.dataset.preset);if(!pr)return;
  CAT.groups.push({id:uid(),name:pr[0],agency:pr[1],gen:pr[2],color:COLORS[CAT.groups.length%COLORS.length]});if(!CAT.agencies.includes(pr[1]))CAT.agencies.push(pr[1]);await saveCat();toast(`${pr[0]}を追加しました`);renderRoom();});

/* ---------- migrate data from the previous version of this site ---------- */
async function migrateOld(){
  if(!db)return;try{if(await getMeta('migratedV1'))return;}catch(e){return}
  try{if(indexedDB.databases){const list=await indexedDB.databases();if(!list.some(d=>d.name==='my-kpop-room-local')){await putMeta('migratedV1',true);return;}}}catch(e){}
  const old=await new Promise(res=>{try{const r=indexedDB.open('my-kpop-room-local',1);r.onupgradeneeded=()=>{r.result.createObjectStore('media',{keyPath:'id'});r.result.createObjectStore('settings')};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}});
  if(!old)return;
  const get=(store,fn)=>new Promise(res=>{try{const t=old.transaction(store,'readonly');const q=fn(t.objectStore(store));q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}});
  const items=await get('media',s=>s.getAll())||[];const wall=await get('settings',s=>s.get('wallpaper'));
  let n=0;
  for(const it of items){if(!it||!it.file)continue;
    const gname=String(it.group_name||'未分類').trim();let g=CAT.groups.find(x=>x.name.toLowerCase()===gname.toLowerCase());
    if(!g){g={id:uid(),name:gname,agency:'',gen:'',color:COLORS[CAT.groups.length%COLORS.length]};CAT.groups.push(g);indexCat();}
    const cname=String(it.category_name||'').trim();const parts=cname.split(/\s*(?:×|✕|x|X|&|＆|\/|・|,|、)\s*/).filter(Boolean);
    const memberFor=name=>{let mm=CAT.members.find(x=>x.groupId===g.id&&x.name===name);if(!mm){mm={id:uid(),name,groupId:g.id};CAT.members.push(mm)}return mm;};
    const m={id:'old-'+it.id,kind:it.media_type==='video'?'video':'photo',cat:'group',groupIds:[g.id],memberIds:[],chemiId:null,tags:[],memo:'',fav:false,added:it.created_at||Date.now(),name:it.original_name||'',mime:it.file.type||'',size:it.file.size||0,thumb:null};
    if(!cname||/^(全体|グループ|group|all)$/i.test(cname)||cname.toLowerCase()===gname.toLowerCase()){}
    else if(parts.length>=2){const ids=parts.map(p=>memberFor(p).id);let c=CAT.chemis.find(x=>x.name===cname);if(!c){c={id:uid(),name:cname,memberIds:ids};CAT.chemis.push(c)}indexCat();m.cat='chemi';m.chemiId=c.id;m.memberIds=[...c.memberIds];}
    else{m.cat='member';m.memberIds=[memberFor(cname).id];}
    if(MEDIA.has(m.id))continue;
    m.thumb=await makeThumb(it.file,m.kind);
    try{await saveItem(m,it.file);MEDIA.set(m.id,m);n++}catch(e){console.error(e)}
  }
  await saveCat();
  if(wall&&!(await getMeta('wallpaper').catch(()=>null))){await putMeta('wallpaper',wall);showWall(wall);}
  await putMeta('migratedV1',true);old.close();
  if(n)setTimeout(()=>toast(`前のバージョンの${n}件を引き継ぎました`),400);
}

/* ---------- boot ---------- */
async function boot(){
  bindFilters();
  db=await openDB();
  if(db){try{const cat=await getMeta('catalog');if(cat)CAT=Object.assign({agencies:[...PRESET_AGENCIES],groups:[],members:[],chemis:[],subs:[]},cat);
      const s=await getMeta('settings');if(s)SET=Object.assign(SET,s);
      const list=await getAllMedia();(list||[]).forEach(m=>MEDIA.set(m.id,m));
      const w=await getMeta('wallpaper');if(w)showWall(w);}catch(e){console.error(e)}}
  indexCat();applySettings();await loadIcons();
  try{await migrateOld()}catch(e){console.error(e)}
  const h=(location.hash||'').replace('#','');go(TABS.some(t=>t[0]===h)?h:'home');
  if(!db){const w=document.createElement('div');w.className='warn';w.textContent='このブラウザでは保存機能が使えないため、ページを閉じると内容が消えます（プライベートブラウズを解除すると保存できます）。';$('#app').prepend(w);}
}
boot();
})();

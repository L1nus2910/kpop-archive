c.width=c.height=0;if(kind==='video'){try{src.removeAttribute('src');src.load()}catch(_){}}else{src.src=''}

const groups=sortedGroups();
const mem=st.group?membersOf(st.group):[];
const chemis=CAT.chemis.filter(c=>!st.group||chemiGroups(c).includes(st.group));
root.innerHTML=`<div class="form-grid">
<div class="field"><span class="flabel">分類</span><div class="seg">${cats.map(([v,l])=>`<button type="button" data-tcat="${v}" class="${st.cat===v?'on':''}">${l}</button>`).join('')}</div></div>
${st.cat!=='keep'?`
<div class="field"><label for="${prefix}-group">グループ${st.cat==='chemi'?'（ケミを絞り込み）':''}</label>
<div class="row"><select id="${prefix}-group" data-t="group">${opt('',groups.length?'グループを選ぶ':'グループが未登録です',st.group)}${groups.map(g=>opt(g.id,`${g.name}（${g.agency||'-'}・${genLabel(g.gen)}）`,st.group)).join('')}</select>
<button type="button" class="btn sm" data-tnew="group">＋新規</button></div></div>
${st.cat==='member'?`<div class="field"><label for="${prefix}-member">メンバー</label>
<div class="row"><select id="${prefix}-member" data-t="member" ${st.group?'':'disabled'}>${opt('',st.group?(mem.length?'メンバーを選ぶ':'メンバーが未登録です'):'先にグループを選ぶ',st.member)}${mem.map(m=>opt(m.id,m.name,st.member)).join('')}</select>
<button type="button" class="btn sm" data-tnew="member" ${st.group?'':'disabled'}>＋新規</button></div></div>`:''}
${st.cat==='chemi'?`<div class="field"><label for="${prefix}-chemi">ケミ</label>
<div class="row"><select id="${prefix}-chemi" data-t="chemi">${opt('',chemis.length?'ケミを選ぶ':'ケミが未登録です',st.chemi)}${chemis.map(c=>opt(c.id,c.name,st.chemi)).join('')}</select>
<button type="button" class="btn sm" data-tnew="chemi">＋新規</button></div></div>`:''}`:''}
${st.cat!=='keep'&&tagOwner(st)?(()=>{const subs=subsOf(tagOwner(st));return `<div class="field"><label for="${prefix}-sub">サブボード（任意）</label>
<div class="row"><select id="${prefix}-sub" data-t="sub">${opt('','入れない',st.sub)}${subs.map(x=>opt(x.id,x.name+(x.emoji?' '+x.emoji:''),st.sub)).join('')}</select>
<button type="button" class="btn sm" data-tnew="sub">＋新規</button></div></div>`})():''}
<div class="field"><label for="${prefix}-tags">${multi?'追加するタグ':'タグ'}（カンマ区切り）</label><input type="text" id="${prefix}-tags" data-t="tags" placeholder="例：音楽番組, 空港, 私服, 2026" value="${esc(st.tags)}"></div>
<div class="field"><label for="${prefix}-memo">メモ</label><input type="text" id="${prefix}-memo" data-t="memo" placeholder="${multi?'入力すると選択中すべてに上書き':'イベント名・日付など'}" value="${esc(st.memo)}"></div>
</div>`;
};
root.addEventListener('click',e=>{const c=e.target.closest('[data-tcat]');if(c){st.cat=c.dataset.tcat;if(st.sub&&S.get(st.sub)?.owner!==tagOwner(st))st.sub='';draw();return;}
const n=e.target.closest('[data-tnew]');if(!n)return;const k=n.dataset.tnew;
if(k==='group')openGroupModal(null,g=>{st.group=g.id;st.member='';draw()});
if(k==='member')openMemberQuick(st.group,m=>{st.member=m.id;draw()});
if(k==='chemi')openChemiModal(null,c=>{st.chemi=c.id;draw()},st.group);
if(k==='sub'){const o=tagOwner(st);if(o)openSubModal(o,null,x=>{st.sub=x.id;draw()});}
});
root.addEventListener('change',e=>{const k=e.target.dataset.t;if(!k||k==='tags'||k==='memo')return;st[k]=e.target.value;if(k!=='sub'){const o=tagOwner(st);if(st.sub&&(!o||S.get(st.sub)?.owner!==o))st.sub='';}if(k==='group'){st.member='';if(st.chemi&&st.group&&!chemiGroups(C.get(st.chemi)||{memberIds:[]}).includes(st.group))st.chemi=''}draw();});
root.addEventListener('input',e=>{const k=e.target.dataset.t;if(k==='tags'||k==='memo')st[k]=e.target.value;});
draw();return {draw};
}
function tagOwner(st){if(st.cat==='group'&&st.group)return 'g:'+st.group;if(st.cat==='member'&&st.member)return 'm:'+st.member;if(st.cat==='chemi'&&st.chemi)return 'c:'+st.chemi;return '';}
function validateTag(st){
if(st.cat==='keep')return null;
if(st.cat==='group'&&!st.group)return 'グループを選んでください';
if(st.cat==='member'&&(!st.group||!st.member))return 'グループとメンバーを選んでください';
if(st.cat==='chemi'&&!st.chemi)return 'ケミを選んでください';
return null;
}
const splitTags=s=>String(s||'').split(/[,、，\n]/).map(t=>t.trim().replace(/^#/,'')).filter(Boolean);
function applyTag(m,st,multi){
if(st.cat!=='keep'){m.cat=st.cat;
if(st.cat==='group'){m.groupIds=[st.group];m.memberIds=[];m.chemiId=null}
if(st.cat==='member'){m.groupIds=[st.group];m.memberIds=[st.member];m.chemiId=null}
if(st.cat==='chemi'){const c=C.get(st.chemi);m.chemiId=c.id;m.memberIds=[...c.memberIds];m.groupIds=chemiGroups(c)}
const o=tagOwner(st);m.sub=st.sub&&S.get(st.sub)?.owner===o?st.sub:null;}
const tags=splitTags(st.tags);
m.tags=multi?[...new Set([...(m.tags||[]),...tags])]:tags;
if(!multi||st.memo.trim())m.memo=st.memo.trim();
}
function openGroupModal(gid,done){

const st={name:g?.name||'',agency:g?.agency||'',gen:g?.gen||'5',color:g?.color||COLORS[CAT.groups.length%COLORS.length],newAgency:''};
const m=openModal(`<h3>${g?'グループを編集':'グループを追加'}</h3>
<div class="form-grid">
${g?'':(()=>{const ex=new Set(CAT.groups.map(x=>x.name.toLowerCase()));const ps=PRESET_GROUPS.filter(p=>!ex.has(p[0].toLowerCase()));return ps.length?`<div class="field"><span class="flabel">プリセットから選ぶ（名前・事務所・世代が入ります）</span><div class="chips">${ps.map(p=>`<button type="button" class="chip" data-gpreset="${esc(p[0])}">${esc(p[0])}</button>`).join('')}</div></div>`:''})()}

<div class="row" style="align-items:flex-start;flex-wrap:wrap">
<div class="field" style="flex:1 1 180px"><label for="gm-agency">事務所</label><select id="gm-agency">${opt('','選択してください',st.agency)}${CAT.agencies.map(a=>opt(a,a,st.agency)).join('')}${opt('__new','＋ 新しい事務所を入力',null)}</select>
<input type="text" id="gm-agency-new" placeholder="事務所名" hidden style="margin-top:6px"></div>
<div class="field" style="flex:1 1 120px"><label for="gm-gen">世代</label><select id="gm-gen">${opt('','未設定',st.gen)}${GENS.map(x=>opt(x,genLabel(x),st.gen)).join('')}</select></div>
</div>
<div class="field"><span class="flabel">テーマカラー</span><div class="swatches" id="gm-sw">${COLORS.map(c=>`<button type="button" data-c="${c}" class="${c===st.color?'on':''}" style="background:${c}" aria-label="色 ${c}"></button>`).join('')}</div></div>
${g?`<div class="field"><span class="flabel">メンバー</span><div class="chips" id="gm-members">${membersOf(g.id).map(mm=>`<span class="chip">${esc(mm.name)}<button type="button" class="x" data-delmem="${mm.id}" aria-label="${esc(mm.name)}を削除">×</button></span>`).join('')||'<span class="note">未登録</span>'}</div></div>`:''}

<div class="field"><label for="gm-add">${g?'メンバーを追加':'メンバー'}（改行・カンマ区切りでまとめて登録）</label><textarea id="gm-add" placeholder="例：S.COUPS, JEONGHAN, JOSHUA"></textarea></div>
</div>
<div class="acts">${g?`<button class="btn danger" data-a="del" style="margin-right:auto">削除</button>`:''}<button class="btn" data-a="cancel">キャンセル</button><button class="btn primary" data-a="save">保存</button></div>`);
const ag=$('#gm-agency',m),agn=$('#gm-agency-new',m);
m.addEventListener('click',e=>{const p=e.target.closest('[data-gpreset]');if(!p)return;const pr=PRESET_GROUPS.find(x=>x[0]===p.dataset.gpreset);if(!pr)return;
$('#gm-name',m).value=pr[0];if(!CAT.agencies.includes(pr[1]))CAT.agencies.push(pr[1]);if(![...ag.options].some(o=>o.value===pr[1]))ag.add(new Option(pr[1],pr[1]),ag.options.length-1);ag.value=pr[1];agn.hidden=true;$('#gm-gen',m).value=pr[2];
$$('[data-gpreset]',m).forEach(x=>x.classList.toggle('on',x===p));});
ag.addEventListener('change',()=>{agn.hidden=ag.value!=='__new';if(!agn.hidden)agn.focus()});
$('#gm-sw',m).addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;st.color=b.dataset.c;$$('#gm-sw button',m).forEach(x=>x.classList.toggle('on',x===b));});
m.addEventListener('click',async e=>{
const dm=e.target.closest('[data-delmem]');
if(dm){const id=dm.dataset.delmem;const name=M.get(id)?.name;if(!await confirmBox(`${name}を削除しますか？`,'写真は残りますが、このメンバーの紐づけは外れます。','削除する'))return;
CAT.members=CAT.members.filter(x=>x.id!==id);CAT.chemis.forEach(c=>c.memberIds=c.memberIds.filter(x=>x!==id));CAT.chemis=CAT.chemis.filter(c=>c.memberIds.length>=2);await saveCat();dm.closest('.chip').remove();refresh();return;}
const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
if(a==='cancel'){closeModal();return;}
if(a==='del'){if(!await confirmBox(`${g.name}を削除しますか？`,'メンバーとケミの登録も消えます。写真自体は残り「未分類」になります。','削除する'))return;
const mids=membersOf(g.id).map(x=>x.id);CAT.groups=CAT.groups.filter(x=>x.id!==g.id);CAT.members=CAT.members.filter(x=>x.groupId!==g.id);
CAT.chemis.forEach(c=>c.memberIds=c.memberIds.filter(x=>!mids.includes(x)));CAT.chemis=CAT.chemis.filter(c=>c.memberIds.length>=2);
['library','collection'].forEach(v=>{if(F[v].group===g.id)F[v]=Object.assign(blankF(),{open:F[v].open})});
await saveCat();closeModal();toast('グループを削除しました');refresh();return;}
const name=$('#gm-name',m).value.trim();if(!name){toast('グループ名を入力してください');return;}
let agency=ag.value==='__new'?agn.value.trim():ag.value;
if(agency&&!CAT.agencies.includes(agency))CAT.agencies.push(agency);
const gen=$('#gm-gen',m).value;

if(g){Object.assign(g,{name,agency,gen,color:st.color,emoji,desc})}else{target={id:uid(),name,agency,gen,color:st.color,emoji,desc};CAT.groups.push(target)}
const names=splitTags($('#gm-add',m).value);const existing=new Set(membersOf(target.id).map(x=>x.name));
names.filter(n=>!existing.has(n)).forEach(n=>CAT.members.push({id:uid(),name:n,groupId:target.id}));
await saveCat();closeModal();toast(g?'保存しました':`${name}を追加しました`);done?done(target):refresh();
});
}
function openMemberQuick(gid,done){const g=G.get(gid);if(!g)return;
const m=openModal(`<h3>${esc(g.name)}にメンバーを追加</h3><div class="field"><label for="mq-names">名前（改行・カンマ区切りでまとめて登録）</label><textarea id="mq-names" placeholder="例：KARINA, GISELLE"></textarea></div><div class="acts"><button class="btn" data-a="c">キャンセル</button><button class="btn primary" data-a="s">追加</button></div>`);
m.addEventListener('click',async e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;if(a==='c'){closeModal();return;}
const names=splitTags($('#mq-names',m).value);if(!names.length){toast('名前を入力してください');return;}
const ex=new Set(membersOf(gid).map(x=>x.name));let first=null;names.forEach(n=>{if(ex.has(n)){first=first||membersOf(gid).find(x=>x.name===n);return}const nm={id:uid(),name:n,groupId:gid};CAT.members.push(nm);first=first||nm;});
await saveCat();closeModal();toast(`${names.length}人を追加しました`);done?done(first):refresh();});
}
function openChemiModal(cid,done,groupHint){
const c=cid?C.get(cid):null;const st={name:c?.name||'',ids:new Set(c?.memberIds||[]),g:groupHint||(c?chemiGroups(c)[0]:'')||sortedGroups()[0]?.id||''};
if(!CAT.members.length){toast('先にグループとメンバーを登録してください');return;}
const m=openModal(`<h3>${c?'ケミを編集':'ケミを作る'}</h3>
<p class="note" style="margin:0">2人以上のメンバーを選びます。別グループのメンバー同士も組み合わせられます。</p>
<div class="field"><label for="cm-g">グループから選ぶ</label><select id="cm-g">${sortedGroups().map(g=>opt(g.id,g.name,st.g)).join('')}</select></div>
<div class="picklist" id="cm-pick"></div>
<div class="field"><span class="flabel">選択中</span><div class="chips" id="cm-sel"></div></div>
<div class="field"><label for="cm-name">ケミ名（空欄ならメンバー名から自動）</label><input type="text" id="cm-name" value="${esc(st.name)}" placeholder="例：ミンギュ×ウォヌ"></div>
<div class="row" style="align-items:flex-end"><div class="field" style="width:84px;flex:none"><label for="cm-emoji">絵文字</label><input type="text" id="cm-emoji" maxlength="4" value="${esc(c?.emoji||'')}" placeholder="💞"></div>
<div class="field" style="flex:1"><label for="cm-desc">紹介文</label><input type="text" id="cm-desc" value="${esc(c?.desc||'')}" placeholder="ケミの名前の由来・メモなど"></div></div>
<div class="acts">${c?`<button class="btn danger" data-a="del" style="margin-right:auto">削除</button>`:''}<button class="btn" data-a="c">キャンセル</button><button class="btn primary" data-a="s">保存</button></div>`);
const draw=()=>{$('#cm-pick',m).innerHTML=membersOf(st.g).map(x=>`<button type="button" class="chip ${st.ids.has(x.id)?'on':''}" data-pm="${x.id}">${esc(x.name)}</button>`).join('')||'<span class="note">このグループにはメンバーが未登録です</span>';
$('#cm-sel',m).innerHTML=[...st.ids].map(id=>M.get(id)).filter(Boolean).map(x=>`<span class="chip">${esc(x.name)}<button type="button" class="x" data-pm="${x.id}" aria-label="外す">×</button></span>`).join('')||'<span class="note">まだ選んでいません</span>';
$('#cm-name',m).placeholder=[...st.ids].map(id=>M.get(id)?.name).filter(Boolean).join('×')||'例：ミンギュ×ウォヌ';};
$('#cm-g',m).addEventListener('change',e=>{st.g=e.target.value;draw()});
m.addEventListener('click',async e=>{const p=e.target.closest('[data-pm]');if(p){const id=p.dataset.pm;st.ids.has(id)?st.ids.delete(id):st.ids.add(id);draw();return;}
const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;if(a==='c'){closeModal();return;}
if(a==='del'){if(!await confirmBox(`${c.name}を削除しますか？`,'写真は残り、メンバーの紐づけはそのままです。','削除する'))return;CAT.chemis=CAT.chemis.filter(x=>x.id!==c.id);await saveCat();closeModal();refresh();return;}
if(st.ids.size<2){toast('メンバーを2人以上選んでください');return;}

const emoji=$('#cm-emoji',m).value.trim(),desc=$('#cm-desc',m).value.trim();

if(c){for(const md of MEDIA.values())if(md.chemiId===c.id){md.memberIds=[...ids];md.groupIds=chemiGroups(c)}await putMediaMany([...MEDIA.values()].filter(md=>md.chemiId===c.id));}
await saveCat();closeModal();toast('ケミを保存しました');done?done(t):refresh();});
draw();

function openEdit(ids){
const multi=ids.length>1;const m0=MEDIA.get(ids[0]);
const st=multi?{cat:'keep',group:'',member:'',chemi:'',tags:'',memo:'',sub:''}:{cat:m0.cat,group:m0.groupIds?.[0]||'',member:m0.memberIds?.[0]||'',chemi:m0.chemiId||'',tags:(m0.tags||[]).join(', '),memo:m0.memo||'',sub:m0.sub||''};
if(!multi&&m0.cat==='chemi'){st.group=''}
const m=openModal(`<h3>${multi?`${ids.length}件の分類をまとめて変更`:'分類・タグを編集'}</h3><div id="ed-form"></div><div class="acts"><button class="btn" data-a="c">キャンセル</button><button class="btn primary" data-a="s">保存</button></div>`);
mountTagForm($('#ed-form',m),st,{multi,prefix:'ed'});
m.addEventListener('click',async e=>{const a=e.target.closest('.acts [data-a]')?.dataset.a;if(!a)return;if(a==='c'){closeModal();return;}
const err=validateTag(st);if(err){toast(err);return;}
const list=ids.map(id=>MEDIA.get(id)).filter(Boolean);list.forEach(x=>applyTag(x,st,multi));await putMediaMany(list);closeModal();toast('保存しました');refresh();if(!$('#lightbox').hidden)drawLB();});
}
const LB={ids:[],i:0,url:null};
function openLB(ids,i){LB.ids=ids;LB.i=i;$('#lightbox').hidden=false;document.body.classList.add('noscroll');drawLB();}
function closeLB(){$('#lightbox').hidden=true;$('#lightbox').innerHTML='';document.body.classList.remove('noscroll');if(LB.url){URL.revokeObjectURL(LB.url);LB.url=null}}
async function drawLB(){
const m=MEDIA.get(LB.ids[LB.i]);if(!m){closeLB();return;}
const blob=await getFile(m.id);if(LB.url)URL.revokeObjectURL(LB.url);LB.url=blob?URL.createObjectURL(blob):null;
const gs=groupsOfMedia(m);const mem=(m.memberIds||[]).map(id=>M.get(id)).filter(Boolean);const ch=C.get(m.chemiId);
$('#lightbox').innerHTML=`
<div class="lb-top"><button class="lb-btn" data-lb="close" aria-label="閉じる">${ic('x')}</button><span class="cnt">${LB.i+1} / ${LB.ids.length}</span>
<div class="sp">
<button class="lb-btn ${m.fav?'on':''}" data-lb="fav" aria-label="${m.fav?'☆を外す':'☆を付ける'}" title="My Collection">${m.fav?'★':'☆'}</button>
<button class="lb-btn" data-lb="down" aria-label="端末に保存" title="端末に保存">${ic('down')}</button>
${m.kind==='photo'?`<button class="lb-btn" data-lb="wall" aria-label="壁紙に設定" title="壁紙に設定">${ic('wall')}</button>`:''}

<button class="lb-btn" data-lb="del" aria-label="削除" title="削除">${ic('trash')}</button>
</div></div>
<div class="lb-stage">${LB.url?(m.kind==='video'?`<video src="${LB.url}" controls playsinline></video>`:`<img src="${LB.url}" alt="${esc(titleOf(m))}">`):'<p>ファイルを読み込めませんでした</p>'}
${LB.ids.length>1?`<button class="lb-nav prev" data-lb="prev" aria-label="前へ">${ic('left')}</button><button class="lb-nav next" data-lb="next" aria-label="次へ">${ic('right')}</button>`:''}</div>
<div class="lb-info"><div class="t">${esc(titleOf(m))} <span style="opacity:.6;font-weight:400;font-size:12px">· ${CAT_LABEL[m.cat]||''}</span></div>
<div class="chips">${gs.map(g=>`<span class="chip"><span class="dot" style="--gcol:${esc(g.color)}"></span>${esc(g.name)}</span><span class="chip">${esc(g.agency||'事務所未設定')}</span><span class="chip">${genLabel(g.gen)}</span>`).join('')}
${m.cat!=='member'?mem.map(x=>`<span class="chip">${esc(x.name)}</span>`).join(''):''}${(m.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`).join('')}</div>
${m.memo?`<div>${esc(m.memo)}</div>`:''}<div class="meta">${fmtDT(m.added)} に追加${m.taken?` · ファイルの日付 ${fmtDate(m.taken)}`:''} · ${esc(m.name||'')} · ${fmtSize(m.size||0)}</div></div>`;
}
$('#lightbox').addEventListener('click',async e=>{const a=e.target.closest('[data-lb]')?.dataset.lb;if(!a)return;const m=MEDIA.get(LB.ids[LB.i]);
if(a==='close')closeLB();
if(a==='prev'){LB.i=(LB.i-1+LB.ids.length)%LB.ids.length;drawLB();}
if(a==='next'){LB.i=(LB.i+1)%LB.ids.length;drawLB();}
if(a==='fav'){m.fav=!m.fav;m.favAt=Date.now();await putMedia(m);toast(m.fav?'☆ My Collectionに追加しました':'My Collectionから外しました');drawLB();refresh();}
if(a==='down'){const b=await getFile(m.id);if(b)await downloadBlob(b,fileNameOf(m));}
if(a==='wall'){const b=await getFile(m.id);if(b){closeLB();await setWallpaper(b);}}
if(a==='edit')openEdit([m.id]);

<div class="warn" style="background:${persisted?'var(--mint-soft)':'var(--accent-soft)'}">${persisted?'✓ このブラウザの保存データは保護されています。サイトを更新しても、写真・分類・☆・表紙・壁紙は消えません。':'サイトを更新しても写真や分類は消えません。ただ、iPhoneはしばらく開かないサイトのデータを消すことがあるため、<b>ホーム画面に追加</b>して使うと安心です。'}</div>
<p class="note" style="margin:0">${usage?usage+'<br>':''}${SET.lastBackup?`最後のバックアップ：${fmtDate(SET.lastBackup)}${sinceBackup?`（その後 ${sinceBackup}件 追加）`:'（その後の追加なし）'}`:'まだバックアップしていません。'}<br>機種変更やブラウザのデータ削除に備えて、ときどき書き出しておくと安心です。</p>
<div class="btn-row"><button class="btn" data-act="export">${ic('down')}すべて書き出す</button><button class="btn" data-act="import">${ic('box')}バックアップを読み込む</button></div>
<div id="bk-progress" class="note"></div>
</div>
</div>`;
if(wu)setTimeout(()=>URL.revokeObjectURL(wu),60000);
$('#rm-shade').addEventListener('input',e=>{SET.shade=+e.target.value;$('#rm-shade-v').textContent=Math.round(SET.shade*100)+'%';applySettings();});
$('#rm-blur').addEventListener('input',e=>{SET.blur=+e.target.value;$('#rm-blur-v').textContent=SET.blur+'px';applySettings();});
['change'].forEach(t=>{$('#rm-shade').addEventListener(t,saveSettings);$('#rm-blur').addEventListener(t,saveSettings);});
}
function applySettings(){document.body.classList.toggle('wall-blur',SET.blur>0);document.documentElement.style.setProperty('--shade',SET.shade);document.documentElement.style.setProperty('--blur',SET.blur+'px');}
function saveSettings(){putMeta('settings',SET).catch(()=>{});}
let wallURL=null;
async function setWallpaper(blob){
let b=blob;
try{const u=URL.createObjectURL(blob);const img=await loadImg(u);const s=Math.min(1,2400/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);b=await new Promise(r=>c.toBlob(r,'image/jpeg',.88))||blob;}catch(e){}
SET.wall={x:50,y:50,z:1};saveSettings();
await putMeta('wallpaper',b).catch(()=>{});showWall(b);if(VIEW==='room')renderRoom();
adjustWall(b);
}
function applyWallPos(){const w=SET.wall||{x:50,y:50,z:1};const el=$('#wall');el.style.backgroundPosition=`${w.x}% ${w.y}%`;el.style.transformOrigin=`${w.x}% ${w.y}%`;el.style.transform=`scale(${w.z})`;}
function adjustWall(blob){openCropper({blob,pos:SET.wall,frames:WALL_FRAMES,title:'壁紙の位置を調整',onSave:q=>{SET.wall=q;saveSettings();applyWallPos();if(VIEW==='room')renderRoom();toast('壁紙の位置を調整しました');}});}
function showWall(b){applyWallPos();if(wallURL){URL.revokeObjectURL(wallURL);wallURL=null}
if(b){wallURL=URL.createObjectURL(b);$('#wall').style.backgroundImage=`url("${wallURL}")`;document.body.classList.add('has-wall')}
else{$('#wall').style.backgroundImage='';document.body.classList.remove('has-wall')}}
$('#hidden-wall-input').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f){await setWallpaper(f);}});
async function exportAll(){
if(!await loadZip()){toast('書き出しの準備ができませんでした。通信状況を確認してください');return;}
const out=$('#bk-progress');const zip=new JSZip();const list=[...MEDIA.values()];
const meta=list.map(m=>{const {thumb,...rest}=m;return rest});
zip.file('catalog.json',JSON.stringify(CAT));zip.file('media.json',JSON.stringify(meta));zip.file('settings.json',JSON.stringify(SET));const ipos={};ICONS.forEach((v,k)=>{zip.file(`icons/${encodeURIComponent(k)}.jpg`,v.blob);ipos[k]={x:v.x,y:v.y,z:v.z}});zip.file('icons.json',JSON.stringify(ipos));
let i=0;for(const m of list){const b=await getFile(m.id);if(b)zip.file(`files/${m.id}`,b);if(m.thumb)zip.file(`thumbs/${m.id}.jpg`,m.thumb);i++;if(out)out.textContent=`${i} / ${list.length} 件を準備中…`;}
const wall=await getMeta('wallpaper').catch(()=>null);if(wall)zip.file('wallpaper.jpg',wall);
if(out)out.textContent='ZIPを作成中…';
const blob=await zip.generateAsync({type:'blob'},p=>{if(out)out.textContent=`ZIPを作成中… ${Math.round(p.percent)}%`});
await downloadBlob(blob,`kphoto-backup_${fmtDate(Date.now()).replace(/\./g,'')}.zip`);SET.lastBackup=Date.now();saveSettings();if(out)out.textContent=`${list.length}件を書き出しました（${fmtSize(blob.size)}）`;
}
async function importAll(file){
if(!await loadZip()){toast('読み込みの準備ができませんでした。通信状況を確認してください');return;}
const out=$('#bk-progress');
try{const zip=await JSZip.loadAsync(file);
const cat=JSON.parse(await zip.file('catalog.json').async('string'));const meta=JSON.parse(await zip.file('media.json').async('string'));
const gi=new Set(CAT.groups.map(x=>x.id)),mi=new Set(CAT.members.map(x=>x.id)),ci=new Set(CAT.chemis.map(x=>x.id));
cat.groups.forEach(x=>{if(!gi.has(x.id))CAT.groups.push(x)});cat.members.forEach(x=>{if(!mi.has(x.id))CAT.members.push(x)});cat.chemis.forEach(x=>{if(!ci.has(x.id))CAT.chemis.push(x)});CAT.subs=CAT.subs||[];const si=new Set(CAT.subs.map(x=>x.id));(cat.subs||[]).forEach(x=>{if(!si.has(x.id))CAT.subs.push(x)});
(cat.agencies||[]).forEach(a=>{if(!CAT.agencies.includes(a))CAT.agencies.push(a)});await saveCat();
let n=0,i=0;for(const m of meta){i++;if(out)out.textContent=`${i} / ${meta.length} 件を読み込み中…`;if(MEDIA.has(m.id))continue;
const fz=zip.file(`files/${m.id}`);if(!fz)continue;const blob=new Blob([await fz.async('arraybuffer')],{type:m.mime||''});
const tz=zip.file(`thumbs/${m.id}.jpg`);m.thumb=tz?new Blob([await tz.async('arraybuffer')],{type:'image/jpeg'}):null;
await saveItem(m,blob);MEDIA.set(m.id,m);n++;}
let ipos={};try{const ij=zip.file('icons.json');if(ij)ipos=JSON.parse(await ij.async('string'))}catch(_){}
const ifs=[];zip.forEach((p,f)=>{if(p.startsWith('icons/')&&!f.dir)ifs.push([p,f])});for(const [p,f] of ifs){const k=decodeURIComponent(p.slice(6).replace(/\.jpg$/,''));if(!ICONS.has(k))ICONS.set(k,{blob:new Blob([await f.async('arraybuffer')],{type:'image/jpeg'}),...(ipos[k]||{x:50,y:50,z:1})})}if(ifs.length)await saveIcons();
const wz=zip.file('wallpaper.jpg');if(wz&&!(await getMeta('wallpaper').catch(()=>null))){const w=new Blob([await wz.async('arraybuffer')],{type:'image/jpeg'});await putMeta('wallpaper',w);showWall(w);}
if(out)out.textContent=`${n}件を読み込みました`;toast(`バックアップから${n}件を復元しました`);renderRoom();
}catch(e){console.error(e);if(out)out.textContent='このファイルは読み込めませんでした。KPhotoで書き出したZIPを選んでください。';}
}
$('#hidden-import-input').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importAll(f);});
document.addEventListener('click',async e=>{
const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
if(a==='toggle-filters'){const v=VIEW;F[v].open=!F[v].open;renderGridView(v);return;}
if(a==='reset-filters'){const v=VIEW;F[v]=Object.assign(blankF(),{open:F[v].open});renderGridView(v);return;}
if(a==='more'){SHOWN[b.dataset.view]+=120;renderGridView(b.dataset.view);return;}
if(a==='toggle-select'){SEL.on?(endSelect(),refresh()):startSelect(VIEW);return;}
if(a==='open-group'){LIB.mode='browse';LIB.g=b.dataset.id;LIB.sec='';LIB.b='';LIB.s='';go('library');try{history.pushState({lib:{...LIB}},'','#library')}catch(_){}return;}
if(a==='go-search'){LIB.mode='search';go('library',{focus:'q'});return;}
if(a==='toggle-theme'){const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);setTheme(dark?'light':'dark');return;}
if(a==='new-group'){openGroupModal(null);return;}
if(a==='edit-group'){openGroupModal(b.dataset.id);return;}
if(a==='new-chemi'){openChemiModal(null);return;}
if(a==='edit-chemi'){openChemiModal(b.dataset.id);return;}
if(a==='go-room-wall'||a==='go-room-groups'){go('room');setTimeout(()=>$(a==='go-room-wall'?'#room-wall':'#room-groups')?.scrollIntoView({behavior:'smooth',block:'start'}),120);return;}
if(a==='pick-wall'){$('#hidden-wall-input').click();return;}
if(a==='wall-from-lib'){F.library.kind='photo';go('library');toast('写真を開いて「壁紙に設定」ボタンを押してください');return;}
if(a==='adjust-wall'){const w=await getMeta('wallpaper').catch(()=>null);if(w)adjustWall(w);return;}
if(a==='reset-wall'){await putMeta('wallpaper',null).catch(()=>{});showWall(null);renderRoom();toast('初期デザインに戻しました');return;}
if(a==='export'){exportAll();return;}
if(a==='import'){$('#hidden-import-input').click();return;}
});
document.addEventListener('click',e=>{const t=e.target.closest('[data-theme-set]');if(t)setTheme(t.dataset.themeSet);});
document.addEventListener('click',async e=>{const p=e.target.closest('[data-preset]');if(!p)return;const pr=PRESET_GROUPS.find(x=>x[0]===p.dataset.preset);if(!pr)return;
CAT.groups.push({id:uid(),name:pr[0],agency:pr[1],gen:pr[2],color:COLORS[CAT.groups.length%COLORS.length]});if(!CAT.agencies.includes(pr[1]))CAT.agencies.push(pr[1]);await saveCat();toast(`${pr[0]}を追加しました`);renderRoom();});
async function migrateOld(){
if(!db)return;try{if(await getMeta('migratedV1'))return;}catch(e){return}
try{if(indexedDB.databases){const list=await indexedDB.databases();if(!list.some(d=>d.name==='my-kpop-room-local')){await putMeta('migratedV1',true);return;}}}catch(e){}
const old=await new Promise(res=>{try{const r=indexedDB.open('my-kpop-room-local',1);r.onupgradeneeded=()=>{r.result.createObjectStore('media',{keyPath:'id'});r.result.createObjectStore('settings')};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}});
if(!old)return;
const get=(store,fn)=>new Promise(res=>{try{const t=old.transaction(store,'readonly');const q=fn(t.objectStore(store));q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}});
const items=await get('media',s=>s.getAll())||[];const wall=await get('settings',s=>s.get('wallpaper'));
let n=0;
for(const it of items){if(!it||!it.file)continue;
const gname=String(it.group_name||'未分類').trim();let g=CAT.groups.find(x=>x.name.toLowerCase()===gname.toLowerCase());
if(!g){g={id:uid(),name:gname,agency:'',gen:'',color:COLORS[CAT.groups.length%COLORS.length]};CAT.groups.push(g);indexCat();}
const cname=String(it.category_name||'').trim();const parts=cname.split(/\s*(?:×|✕|x|X|&|＆|\/|・|,|、)\s*/).filter(Boolean);
const memberFor=name=>{let mm=CAT.members.find(x=>x.groupId===g.id&&x.name===name);if(!mm){mm={id:uid(),name,groupId:g.id};CAT.members.push(mm)}return mm;};
const m={id:'old-'+it.id,kind:it.media_type==='video'?'video':'photo',cat:'group',groupIds:[g.id],memberIds:[],chemiId:null,tags:[],memo:'',fav:false,added:it.created_at||Date.now(),name:it.original_name||'',mime:it.file.type||'',size:it.file.size||0,thumb:null};
if(!cname||/^(全体|グループ|group|all)$/i.test(cname)||cname.toLowerCase()===gname.toLowerCase()){}
else if(parts.length>=2){const ids=parts.map(p=>memberFor(p).id);let c=CAT.chemis.find(x=>x.name===cname);if(!c){c={id:uid(),name:cname,memberIds:ids};CAT.chemis.push(c)}indexCat();m.cat='chemi';m.chemiId=c.id;m.memberIds=[...c.memberIds];}
else{m.cat='member';m.memberIds=[memberFor(cname).id];}
if(MEDIA.has(m.id))continue;
m.thumb=await makeThumb(it.file,m.kind);
try{await saveItem(m,it.file);MEDIA.set(m.id,m);n++}catch(e){console.error(e)}
}
await saveCat();
if(wall&&!(await getMeta('wallpaper').catch(()=>null))){await putMeta('wallpaper',wall);showWall(wall);}
await putMeta('migratedV1',true);old.close();
if(n)setTimeout(()=>toast(`前のバージョンの${n}件を引き継ぎました`),400);
}
async function boot(){
bindFilters();
db=await openDB();
if(db){try{const cat=await getMeta('catalog');if(cat)CAT=Object.assign({agencies:[...PRESET_AGENCIES],groups:[],members:[],chemis:[],subs:[]},cat);
const s=await getMeta('settings');if(s)SET=Object.assign(SET,s);
const list=await getAllMedia();(list||[]).forEach(m=>MEDIA.set(m.id,m));
const w=await getMeta('wallpaper');if(w)showWall(w);}catch(e){console.error(e)}}
indexCat();applySettings();await loadIcons();
try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))navigator.storage.persist();}catch(_){}
try{await migrateOld()}catch(e){console.error(e)}
const h=(location.hash||'').replace('#','');go(TABS.some(t=>t[0]===h)?h:'home');
if(!db){const w=document.createElement('div');w.className='warn';w.textContent='このブラウザでは保存機能が使えないため、ページを閉じると内容が消えます（プライベートブラウズを解除すると保存できます）。';$('#app').prepend(w);}
}
boot();
})();</script>

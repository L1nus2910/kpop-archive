<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K-POP メディア整理</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f8f5fb;
      color: #292333;
    }
    header {
      padding: 24px 18px;
      background: #7446a8;
      color: white;
    }
    main {
      max-width: 760px;
      margin: 24px auto;
      padding: 0 16px;
    }
    section, .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px #0000000d;
    }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      margin: 6px 0 12px;
      padding: 11px;
      border: 1px solid #d9d1e2;
      border-radius: 9px;
      font: inherit;
    }
    button {
      border: 0;
      background: #7446a8;
      color: white;
      cursor: pointer;
    }
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .media-grid img, .media-grid video {
      width: 100%;
      border-radius: 10px;
    }
    .small {
      color: #6d6574;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>K-POP メディア整理</h1>
    <p>グループ・メンバー・ケミごとに写真や動画を整理</p>
  </header>

  <main>
    <section>
      <h2>写真・動画を追加</h2>
      <label>グループ<input id="group" placeholder="例：グループ名"></label>
      <label>メンバー・ケミ<input id="person" placeholder="例：メンバー名 / ケミ名"></label>
      <label>種類
        <select id="kind">
          <option value="写真">写真</option>
          <option value="動画">動画</option>
        </select>
      </label>
      <label>スマホやパソコンから選ぶ
        <input id="files" type="file" accept="image/*,video/*" multiple>
      </label>
      <button id="add">選んだメディアを表示</button>
      <p class="small">試作版です。追加した内容はこのブラウザー内だけに表示されます。</p>
    </section>

    <section>
      <h2>整理したメディア</h2>
      <div id="gallery" class="media-grid"></div>
    </section>
  </main>

  <script>
    const filesInput = document.getElementById("files");
    const gallery = document.getElementById("gallery");

    document.getElementById("add").addEventListener("click", () => {
      const group = document.getElementById("group").value.trim() || "グループ未設定";
      const person = document.getElementById("person").value.trim() || "メンバー・ケミ未設定";
      const kind = document.getElementById("kind").value;

      for (const file of filesInput.files) {
        const card = document.createElement("article");
        card.className = "card";

        const title = document.createElement("p");
        title.textContent = `${group} / ${person} / ${kind}`;
        card.appendChild(title);

        const url = URL.createObjectURL(file);
        const media = document.createElement(kind === "写真" ? "img" : "video");
        media.src = url;
        if (kind === "動画") media.controls = true;
        card.appendChild(media);

        const name = document.createElement("p");
        name.className = "small";
        name.textContent = file.name;
        card.appendChild(name);

        gallery.prepend(card);
      }
      filesInput.value = "";
    });
  </script>
</body>
</html>
